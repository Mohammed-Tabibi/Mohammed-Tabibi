<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="Architecture du profil en microservices">
<defs>
  <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="370" y1="0" x2="630" y2="480">
    <stop offset="0" stop-color="#FFFEF9"/><stop offset=".3" stop-color="#F5F1E8"/>
    <stop offset=".7" stop-color="#EBE6D9"/><stop offset="1" stop-color="#E8E3D6"/>
  </linearGradient>
  <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1A1C28"/>
    <stop offset=".5" stop-color="#557C6A"/>
    <stop offset="1" stop-color="#66BB6A"/>
  </linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#84A59D" stroke-opacity=".16" stroke-width="1"/>
  </pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="panel"><rect x=".5" y=".5" width="999" height="479" rx="16"/></clipPath>
</defs>
<style>
.m{font-family:'JetBrains Mono','Fira Code',Consolas,Menlo,'DejaVu Sans Mono','Courier New',monospace}
.s{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif}
.f{opacity:0;animation:fade .01s linear forwards}
@keyframes fade{to{opacity:1}}
@keyframes blink{50%{opacity:0}}
.cur{animation:blink 1s step-end infinite}
</style>
<g clip-path="url(#panel)">
  <rect width="1000" height="480" fill="url(#bg)"/>
  <rect width="1000" height="480" fill="url(#grid)"/>
  <circle cx="360" cy="240" r="150" fill="#66BB6A" opacity=".14" filter="url(#blur)"/>
</g>
<rect x=".5" y=".5" width="999" height="479" rx="16" fill="none" stroke="#C8D3CA"/>
<text x="28" y="36" class="m" font-size="13" fill="#6B7F78">// profile.architecture <tspan fill="#A3B5AE">— ce README est un système distribué</tspan></text>

