<text x="360.0" y="212" text-anchor="middle" class="m" font-size="11" fill="#557C6A">API GATEWAY</text>
<text x="360.0" y="248" text-anchor="middle" class="s" font-size="30" font-weight="800" fill="url(#grad)">YARP</text>
<text x="360.0" y="276" text-anchor="middle" class="m" font-size="12" fill="#6B7F78">route: /api/*</text>
<text x="360.0" y="296" text-anchor="middle" class="m" font-size="11" fill="#7D8F88">auth: JWT ✓</text>

