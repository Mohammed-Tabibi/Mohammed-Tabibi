<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-label="Merci pour ta visite">
<defs>
  <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="370" y1="0" x2="630" y2="170">
    <stop offset="0" stop-color="#FFFEF9"/><stop offset=".3" stop-color="#F5F1E8"/>
    <stop offset=".7" stop-color="#EBE6D9"/><stop offset="1" stop-color="#E8E3D6"/>
  </linearGradient>
  <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1A1C28"/>
    <stop offset=".5" stop-color="#557C6A"/>
    <stop offset="1" stop-color="#66BB6A"/>
  </linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#84A59D" stroke-opacity=".16" stroke-width="1"/>
  </pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="panel"><rect x=".5" y=".5" width="999" height="169" rx="16"/></clipPath>
</defs>
<style>
.m{font-family:'JetBrains Mono','Fira Code',Consolas,Menlo,'DejaVu Sans Mono','Courier New',monospace}
.s{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif}
.f{opacity:0;animation:fade .01s linear forwards}
@keyframes fade{to{opacity:1}}
@keyframes blink{50%{opacity:0}}
.cur{animation:blink 1s step-end infinite}
</style>
<g clip-path="url(#panel)">
  <rect width="1000" height="170" fill="url(#bg)"/>
  <rect width="1000" height="170" fill="url(#grid)"/>
  <circle cx="900" cy="170" r="120" fill="#66BB6A" opacity=".18" filter="url(#blur)"/>
  <rect width="1000" height="4" fill="url(#grad)"/>
</g>
<rect x=".5" y=".5" width="999" height="169" rx="16" fill="none" stroke="#C8D3CA"/>
<text x="964" y="148" text-anchor="end" class="m" font-size="12" fill="#A3B5AE">built with &lt;/&gt; + café · Oujda, Maroc</text>
<g class="f" style="animation-delay:0.30s"><text x="40" y="62" class="m" font-size="15"><tspan fill="#3F9A45">mohammed@oujda</tspan><tspan fill="#6B7F78">:</tspan><tspan fill="#557C6A">~/profile</tspan><tspan fill="#6B7F78">$</tspan></text></g><g class="f" style="animation-delay:0.60s"><text x="275.3" y="62" class="m" font-size="15" fill="#1A1C28">exit</text></g><g class="f" style="animation-delay:1.20s"><text x="40" y="92" class="m" font-size="15" fill="#6B7F78">logout · Connection to <tspan fill="#557C6A">mohammed-tabibi</tspan> closed.</text></g><g class="f" style="animation-delay:1.70s"><text x="40" y="128" class="s" font-size="22" font-weight="800" fill="url(#grad)">Merci pour ta visite — on construit quelque chose ensemble ?</text></g>
</svg>