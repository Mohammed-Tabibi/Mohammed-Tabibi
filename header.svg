.f{opacity:0;animation:fade .01s linear forwards}
@keyframes fade{to{opacity:1}}
@keyframes blink{50%{opacity:0}}
.cur{animation:blink 1s step-end infinite}

@keyframes g1{0%,90%,100%{transform:translate(0,0);opacity:0}91%{transform:translate(-5px,2px);opacity:.75}93%{transform:translate(4px,-2px);opacity:.75}95%{transform:translate(-2px,1px);opacity:.75}96%{opacity:0}}
@keyframes g2{0%,90%,100%{transform:translate(0,0);opacity:0}91%{transform:translate(5px,-1px);opacity:.75}93%{transform:translate(-4px,2px);opacity:.75}95%{transform:translate(3px,0);opacity:.75}96%{opacity:0}}
.gl1{animation:g1 5s infinite 2s} .gl2{animation:g2 5s infinite 2.05s}
@keyframes ty1{to{transform:translateX(73px)}}@keyframes ty2{to{transform:translateX(484px)}}@keyframes ty3{to{transform:translateX(141px)}}
</style>
