# À placer dans : .github/workflows/animations.yml
# Génère Pac-Man + Snake chaque jour à partir de tes contributions.

name: Generate profile animations

on:
  schedule:
    - cron: "0 0 * * *"   # tous les jours à minuit (UTC)
  workflow_dispatch:       # bouton "Run workflow" pour le lancer à la main
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  pacman:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Pac-Man SVG
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#EC4899

      - name: Push to output-snake branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-snake
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
